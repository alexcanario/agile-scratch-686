# Pre-release pipeline, generated by agile@canary (#686; /agile:sync offers it, `node sync.js pipeline prerelease write` writes it). It is yours once written: edit it freely.
# Every push to main (a merge) packs that commit as <Version>-beta and publishes it as the GitHub pre-release beta/<Version>: never `v*`, so no
# stable release workflow starts, and never "latest". A desktop head whose update source is a GitHub repository gets it on the Velopack channel beta
# of that repository: a tester installs <App>-beta-Setup.exe once and takes each newer beta by a delta, never a stable release; a desktop app with no
# update source gets its zips. A version that already has a pre-release publishes nothing and says so; the 5 newest pre-releases stay, older ones and
# their beta/* tags are deleted by the same run; a stable release is never touched. A share keeps its beta at /agile:ship from your machine (#59).
# A failed run leaves the merge as it is, deletes the half-published pre-release with its tag, and is red: rerun it with Actions > Pre-release > Re-run.
# With a mode under `## Code signing` the job takes the GitHub environment release-signing, as release.yml does: the pre-release is signed exactly as
# the stable release and never published unsigned. That environment must allow main in its deployment branches (Settings > Environments >
# release-signing): a run it refuses stops before anything is published.
name: Pre-release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    name: Pre-release of ${{ github.sha }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Keep the line endings of the repository
        run: git config --global core.autocrlf false
      - name: Check out the commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the .NET SDK of global.json
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/agile-release.js beta --ci
